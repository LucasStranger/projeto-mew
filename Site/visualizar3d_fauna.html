<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Realidade Aumentada — Projeto Mew</title>
  
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100dvh; overflow: hidden; background: transparent !important; touch-action: none; }
    
    #scene-container { position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 0; }

    #painel-info {
      position: fixed;
      bottom: 20px; left: 20px; right: 20px;
      background: rgba(5, 30, 15, 0.95);
      border: 2px solid #7ee898;
      border-radius: 16px;
      padding: 20px;
      z-index: 1000;
      display: none; 
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(63, 185, 80, 0.3);
      backdrop-filter: blur(8px);
      max-height: 55vh;
      overflow-y: auto;
    }

    #painel-info h2 { color: #7ee898; font-family: 'Courier New', monospace; text-transform: uppercase; font-size: 1.1rem; margin-bottom: 2px; border-bottom: 1px dashed rgba(126,232,152,0.3); padding-bottom: 8px; }
    #painel-info .cientifico { font-style: italic; color: #a8d8b8; font-size: 0.85rem; margin-bottom: 10px; }

    .btn-hotspot {
      display: flex; align-items: center; gap: 10px;
      background: rgba(126, 232, 152, 0.1);
      border: 1px solid rgba(126, 232, 152, 0.4);
      color: #d5ffdd;
      padding: 12px 15px;
      border-radius: 10px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.9rem; font-weight: 600;
      cursor: pointer; text-align: left;
      transition: all 0.2s;
    }
    .btn-hotspot:active { background: rgba(126, 232, 152, 0.3); border-color: #7ee898; transform: scale(0.98); }
    .btn-hotspot .icone { font-size: 1.1rem; }

    .btn-fechar {
      background: linear-gradient(135deg, #dc0a2d, #a3081f);
      color: white; border: none; padding: 14px; border-radius: 10px;
      font-weight: bold; font-size: 0.95rem; cursor: pointer; margin-top: 10px;
      text-transform: uppercase; letter-spacing: 1px;
      box-shadow: 0 4px 12px rgba(220,10,45,0.4);
    }

    .hint { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #ffcb05; padding: 10px 20px; border-radius: 20px; font-weight: bold; z-index: 999; border: 2px solid #ffcb05; text-align: center; width: 90%; max-width: 400px; font-family: 'Courier New', monospace; font-size: 0.85rem; }

    /* OVERLAY DA IMAGEM */
    #ar-image-overlay {
      display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 9999; width: 85vw; max-width: 400px;
      border-radius: 16px; overflow: hidden; border: 3px solid #7ee898;
      box-shadow: 0 0 40px rgba(0,0,0,0.9); background: #0a1a0c;
      pointer-events: none; animation: popIn 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    }
    #ar-image-overlay img { width: 100%; display: block; }
    @keyframes popIn { from{ opacity: 0; transform: translate(-50%, -40%) scale(0.9); } to{ opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  </style>
</head>
<body>
  <div class="hint" id="hint">📷 Aponte para o QR Code e arraste o dedo para girar</div>

  <div id="ar-image-overlay">
    <img id="ar-image-content" src="" alt="Hotspot">
  </div>

  <div id="painel-info">
    <h2 id="info-nome">Carregando...</h2>
    <div class="cientifico" id="info-cientifico"></div>
    
    <button class="btn-hotspot" id="btn-oque"><span class="icone">❓</span> O que é?</button>
    <button class="btn-hotspot" id="btn-alimentacao"><span class="icone">🥩</span> Alimentação</button>
    <button class="btn-hotspot" id="btn-habitat"><span class="icone">🌿</span> Habitat</button>
    <button class="btn-hotspot" id="btn-ameacas"><span class="icone">⚠️</span> Ameaças</button>
    
    <button class="btn-fechar" id="btn-fechar">Fechar e escanear novamente</button>
  </div>

  <div id="scene-container"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const animalId = params.get('id') || 'pe-1'; 

    const synth = window.speechSynthesis;
    function falar(texto) {
      synth.cancel(); 
      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = 'pt-BR';
      utterance.rate = 1.0; 
      const vozes = synth.getVoices();
      const vozPt = vozes.find(v => v.lang.includes('pt-BR'));
      if (vozPt) utterance.voice = vozPt;
      synth.speak(utterance);
    }

    const modelosMap = {
      'pe-1': 'assets/modelo/peixe_boi.glb',
      'pe-2': 'assets/modelo/tamandua_bandeira_med.glb',
      'pe-3': 'assets/modelo/tatu_bola_do_nordeste_med.glb',
      'pe-4': 'assets/modelo/saira_pintor_med.glb',
      'pe-5': 'assets/modelo/limpa_folha_do_nordeste_med.glb',
      'pe-6': 'assets/modelo/gato_maracaja_med.glb',
      'pe-7': 'assets/modelo/jaguatirica_med.glb',
      'pe-8': 'assets/modelo/tartaruga_de_pente_med.glb',
      'pe-9': 'assets/modelo/tartaruga_de_couro_med.glb',
      'pe-10': 'assets/modelo/galo_de_campina_novo.glb'
    };

    const imagensMap = {
      'pe-1': { oque: 'assets/hotspots/costeiro_peixeboi_animal.jpg', alimentacao: 'assets/hotspots/costeiro_peixeboi_capim.jpg', habitat: 'assets/hotspots/costeiro_peixeboi_estuario.jpg', ameacas: 'assets/hotspots/costeiro_peixeboi_boia.jpg' },
      'pe-2': { oque: 'assets/hotspots/cerrado_tamandua_animal.jpg', alimentacao: 'assets/hotspots/cerrado_tamandua_cupinzeiro.jpg', habitat: 'assets/hotspots/cerrado_tamandua_bioma.jpg', ameacas: 'assets/hotspots/cerrado_tamandua_ameacas.jpg' },
      'pe-3': { oque: 'assets/hotspots/caatinga_tatu_animal.jpg', alimentacao: 'assets/hotspots/caatinga_tatu_formigueiro.jpg', habitat: 'assets/hotspots/caatinga_tatu_bioma.jpg', ameacas: 'assets/hotspots/caatinga_tatu_ameacas.jpg' },
      'pe-4': { oque: 'assets/hotspots/mata_saira_ave.jpg', alimentacao: 'assets/hotspots/mata_saira_frutifera.jpg', habitat: 'assets/hotspots/mata_saira_bioma.jpg', ameacas: 'assets/hotspots/mata_saira_trafico.jpg' },
      'pe-5': { oque: 'assets/hotspots/altitude_limpafolha_ave.jpg', alimentacao: 'assets/hotspots/altitude_limpafolha_folhico.jpg', habitat: 'assets/hotspots/altitude_limpafolha_bioma.jpg', ameacas: 'assets/hotspots/altitude_limpafolha_fragmentacao.jpg' },
      'pe-6': { oque: 'assets/hotspots/noite_maracaja_animal.jpg', alimentacao: 'assets/hotspots/noite_maracaja_vagalumes.jpg', habitat: 'assets/hotspots/noite_maracaja_copa.jpg', ameacas: 'assets/hotspots/noite_maracaja_ameacas.jpg' },
      'pe-7': { oque: 'assets/hotspots/transicao_jaguatirica_animal.jpg', alimentacao: 'assets/hotspots/transicao_jaguatirica_mataciliar.jpg', habitat: 'assets/hotspots/transicao_jaguatirica_caatinga.jpg', ameacas: 'assets/hotspots/transicao_jaguatirica_rodovia.jpg' },
      'pe-8': { oque: 'assets/hotspots/recife_pente_animal.jpg', alimentacao: 'assets/hotspots/recife_pente_esponjas.jpg', habitat: 'assets/hotspots/recife_pente_corais.jpg', ameacas: 'assets/hotspots/recife_pente_ameacas.jpg' },
      'pe-9': { oque: 'assets/hotspots/oceano_couro_animal.jpg', alimentacao: 'assets/hotspots/oceano_couro_aguaviva.jpg', habitat: 'assets/hotspots/oceano_couro_altomar.jpg', ameacas: 'assets/hotspots/oceano_couro_sacola.jpg' },
      'pe-10': { oque: 'assets/hotspots/caatinga_galo_ave.jpg', alimentacao: 'assets/hotspots/caatinga_galo_bioma.jpg', habitat: 'assets/hotspots/caatinga_galo_juazeiro.jpg', ameacas: 'assets/hotspots/caatinga_galo_cupinzeiro.jpg' }
    };

    AFRAME.registerComponent('drag-rotate', {
      init: function () {
        this.isDragging = false;
        this.previousMousePosition = { x: 0, y: 0 };
        
        this.el.sceneEl.canvas.addEventListener('touchstart', (e) => {
          if(e.touches.length === 1) {
            this.isDragging = true;
            this.previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
          }
        }, { passive: true });

        this.el.sceneEl.canvas.addEventListener('touchmove', (e) => {
          if (!this.isDragging || e.touches.length !== 1) return;
          const deltaX = e.touches[0].clientX - this.previousMousePosition.x;
          const deltaY = e.touches[0].clientY - this.previousMousePosition.y;
          this.el.object3D.rotation.y += deltaX * 0.01;
          this.el.object3D.rotation.x += deltaY * 0.01;
          this.el.object3D.rotation.x = Math.max(-0.5, Math.min(0.5, this.el.object3D.rotation.x));
          this.previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
          if(e.cancelable) e.preventDefault();
        }, { passive: false });

        this.el.sceneEl.canvas.addEventListener('touchend', () => { this.isDragging = false; });

        this.el.sceneEl.canvas.addEventListener('mousedown', (e) => {
          this.isDragging = true;
          this.previousMousePosition = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('mousemove', (e) => {
          if (!this.isDragging) return;
          const deltaX = e.clientX - this.previousMousePosition.x;
          const deltaY = e.clientY - this.previousMousePosition.y;
          this.el.object3D.rotation.y += deltaX * 0.01;
          this.el.object3D.rotation.x += deltaY * 0.01;
          this.el.object3D.rotation.x = Math.max(-0.5, Math.min(0.5, this.el.object3D.rotation.x));
          this.previousMousePosition = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('mouseup', () => { this.isDragging = false; });
      }
    });

    let timeoutImagem;
    function falarEMostrar(texto, imagemSrc) {
      falar(texto);
      if (imagemSrc) {
        const overlay = document.getElementById('ar-image-overlay');
        const img = document.getElementById('ar-image-content');
        img.src = imagemSrc;
        overlay.style.display = 'block';
        
        clearTimeout(timeoutImagem);
        timeoutImagem = setTimeout(() => { overlay.style.display = 'none'; }, 15000);
      }
    }

    async function iniciarAR() {
      try {
        const res = await fetch('fauna_pe.json');
        const data = await res.json();
        const animal = data.especies_ameacadas.find(a => a.id === animalId);
        if (!animal) throw new Error("Animal não encontrado");

        document.getElementById('info-nome').textContent = animal.nome_popular;
        document.getElementById('info-cientifico').textContent = animal.nome_cientifico;

        const textoOque = `${animal.classe}. ${animal.caracteristicas.comportamento}. Coloração: ${animal.caracteristicas.coloracao}. Tamanho: ${animal.caracteristicas.tamanho}.`;
        const textoAlimentacao = `Alimenta-se de ${animal.alimentacao.join(', ')}.`;
        const textoHabitat = `Encontrado em ${animal.habitat.join(', ')}.`;
        const textoAmeacas = `As principais ameaças são: ${animal.principais_ameacas.join(', ')}.`;

        document.getElementById('btn-oque').onclick = () => falarEMostrar(textoOque, imagensMap[animalId]?.oque);
        document.getElementById('btn-alimentacao').onclick = () => falarEMostrar(textoAlimentacao, imagensMap[animalId]?.alimentacao);
        document.getElementById('btn-habitat').onclick = () => falarEMostrar(textoHabitat, imagensMap[animalId]?.habitat);
        document.getElementById('btn-ameacas').onclick = () => falarEMostrar(textoAmeacas, imagensMap[animalId]?.ameacas);

        const modeloPath = modelosMap[animalId] || animal.modelo_gltf || "assets/modelo/animais.glb";
        const container = document.getElementById('scene-container');
        
        // ATENÇÃO: O value="5" abaixo é o primeiro QR Code que você imprimiu. 
        // Se você quiser usar o número 7, troque o 5 por 7.
        container.innerHTML = `
          <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;" renderer="alpha: true; antialias: true;" vr-mode-ui="enabled: false" loading-screen="enabled: false">
            <a-assets><a-asset-item id="modelo-animal" src="${modeloPath}"></a-asset-item></a-assets>
            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
            
            <a-marker type="barcode" value="5" id="marcador" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
              
              <!-- QUADRADO VERMELHO DE TESTE (Se isso aparecer, o QR Code funciona) -->
              <a-box color="red" width="0.5" height="0.5" depth="0.5" position="0 0.25 0"></a-box>

              <a-entity id="modelo-wrapper" visible="false" drag-rotate>
                <a-gltf-model id="animal-3d" src="#modelo-animal"></a-gltf-model>
              </a-entity>
              <a-entity light="type: ambient; color: #ffffff; intensity: 1.2"></a-entity>
              <a-entity position="0 2 1" light="type: directional; color: #ffffff; intensity: 1.0"></a-entity>
            </a-marker>
          </a-scene>
        `;

        const cena = container.querySelector('a-scene');
        const marcador = cena.querySelector('#marcador');
        const modeloWrapper = cena.querySelector('#modelo-wrapper');
        const animal3D = document.getElementById('animal-3d');
        const painel = document.getElementById('painel-info');
        const hint = document.getElementById('hint');

        // Tratamento de erro caso o arquivo GLB não carregue
        animal3D.addEventListener('model-error', () => {
          document.getElementById('hint').textContent = "❌ Erro: O arquivo 3D não foi encontrado. Verifique a pasta 'assets/modelo'.";
          document.getElementById('hint').style.display = 'block';
          document.getElementById('hint').style.color = '#ff4d4d';
          document.getElementById('hint').style.borderColor = '#ff4d4d';
        });

        animal3D.addEventListener('model-loaded', () => {
            document.getElementById('hint').style.display = 'none'; // Esconde o erro se carregar
            const mesh = animal3D.getObject3D('mesh');
            if (!mesh) return;
            mesh.position.set(0, 0, 0); mesh.rotation.set(0, 0, 0); mesh.scale.set(1, 1, 1); mesh.updateMatrixWorld(true);
            const box = new THREE.Box3().setFromObject(mesh);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const ALVO = 1.5; 
            const escala = ALVO / maxDim;
            mesh.scale.set(escala, escala, escala); mesh.updateMatrixWorld(true);
            const box2 = new THREE.Box3().setFromObject(mesh);
            mesh.position.set(-center.x * escala, -box2.min.y, -center.z * escala); mesh.updateMatrixWorld(true);
        });

        marcador.addEventListener('markerFound', () => {
          hint.style.display = 'none';
          modeloWrapper.setAttribute('visible', 'true');
          painel.style.display = 'flex';
        });

        marcador.addEventListener('markerLost', () => {
          modeloWrapper.setAttribute('visible', 'false');
          document.getElementById('ar-image-overlay').style.display = 'none';
        });

      } catch (erro) {
        console.error(erro);
        document.getElementById('hint').textContent = "❌ Erro ao carregar os dados.";
      }
    }

    document.getElementById('btn-fechar').addEventListener('click', () => {
      synth.cancel();
      const modeloWrapper = document.getElementById('modelo-wrapper');
      if (modeloWrapper) modeloWrapper.setAttribute('visible', 'false');
      document.getElementById('ar-image-overlay').style.display = 'none';
      document.getElementById('painel-info').style.display = 'none';
      const hint = document.getElementById('hint');
      hint.style.display = 'block';
      hint.textContent = "📷 Aponte para o QR Code novamente";
    });

    window.addEventListener('DOMContentLoaded', iniciarAR);
  </script>
</body>
</html>
