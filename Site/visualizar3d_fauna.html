<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Realidade Aumentada (World Tracking) — Projeto Mew</title>
  
  <!-- Usando a versão mais recente do A-Frame que possui o componente ar-hit-test -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    body { margin: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; background: #000; }
    #ui-overlay {
      position: fixed; bottom: 20px; left: 0; width: 100%;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      z-index: 1000; pointer-events: none;
    }
    #btn-ar {
      background: #7ee898; color: #051020; font-size: 1.1rem; font-weight: bold;
      padding: 15px 30px; border: 2px solid #fff; border-radius: 30px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.5); cursor: pointer; pointer-events: auto;
      text-transform: uppercase; letter-spacing: 1px; transition: transform 0.2s;
    }
    #btn-ar:active { transform: scale(0.95); }
    #instrucao {
      background: rgba(0,0,0,0.7); color: #fff; padding: 8px 15px;
      border-radius: 20px; font-size: 0.8rem; display: none;
    }
  </style>
</head>
<body>

  <div id="ui-overlay">
    <div id="instrucao">Toque na tela para colocar o animal no chão</div>
    <button id="btn-ar">Entrar no Modo AR</button>
  </div>

  <!-- CENA A-FRAME CONFIGURADA PARA WEBXR -->
  <a-scene 
    webxr="optionalFeatures: hit-test, local-floor;"
    ar-hit-test="target: #animal-wrapper;"
    renderer="antialias: true; colorManagement: true;"
    background="transparent: true;"
    style="width: 100vw; height: 100vh; display: block;">
    
    <!-- O animal que será colocado no chão. A classe "clickable" permite que ele seja girado -->
    <a-entity id="animal-wrapper" visible="false">
      <a-gltf-model 
        id="modelo-3d" 
        src="assets/modelo/peixe_boi_med.glb" 
        scale="0.5 0.5 0.5" 
        position="0 0 0">
      </a-gltf-model>
    </a-entity>

    <!-- Luzes para o modelo não ficar preto -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 1.2"></a-entity>
    <a-entity position="0 5 2" light="type: directional; color: #ffffff; intensity: 1.5"></a-entity>

  </a-scene>

  <script>
    const btnAR = document.getElementById('btn-ar');
    const instrucao = document.getElementById('instrucao');
    const sceneEl = document.querySelector('a-scene');
    const animalWrapper = document.getElementById('animal-wrapper');

    // Lógica do botão de entrar no AR
    btnAR.addEventListener('click', () => {
      if (!sceneEl.hasLoaded) return;
      
      // Entra no modo imersivo de AR
      sceneEl.enterVR(); 
      
      // Esconde o botão e mostra a instrução
      btnAR.style.display = 'none';
      instrucao.style.display = 'block';
    });

    // Lógica do componente ar-hit-test
    // Ele dispara o evento 'ar-hit-test-start' quando um plano é encontrado e tocado
    sceneEl.addEventListener('ar-hit-test-start', () => {
      console.log('Hit-test iniciado');
    });

    sceneEl.addEventListener('ar-hit-test-end', () => {
      // Quando o usuário toca na tela e o hit-test encontra o chão
      // O componente posiciona a entidade alvo automaticamente
      animalWrapper.setAttribute('visible', 'true');
      instrucao.textContent = 'Animal fixado! Mova o celular ao redor.';
      
      // Opcional: Tocar no animal faz ele girar
      animalWrapper.classList.add('clickable');
    });

    // Se o usuário sair do modo AR, volta a mostrar o botão
    sceneEl.addEventListener('exit-vr', () => {
      btnAR.style.display = 'block';
      instrucao.style.display = 'none';
      animalWrapper.setAttribute('visible', 'false');
    });

    // Adiciona um leve giro automático para o animal não ficar totalmente estático
    // (Só funciona depois que ele é colocado no chão)
    animalWrapper.addEventListener('model-loaded', () => {
      // Ajuste fino de escala se o modelo estiver muito grande/pequeno
      // O valor '0.5' no HTML pode ser ajustado aqui via JS se necessário
    });
  </script>
</body>
</html>
