<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Realidade Aumentada — Projeto Mew</title>
  
  <!-- Bibliotecas do A-Frame e AR.js -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100dvh; overflow: hidden; background: transparent !important; }
    
    #scene-container { position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 0; }

    /* Painel de Informações (Fica escondido até achar o QR Code) */
    #painel-info {
      position: fixed;
      bottom: 20px; left: 20px; right: 20px;
      background: rgba(5, 30, 15, 0.95);
      border: 2px solid #7ee898;
      border-radius: 16px;
      padding: 20px;
      z-index: 1000;
      display: none; 
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(63, 185, 80, 0.3);
      backdrop-filter: blur(8px);
      max-height: 55vh;
      overflow-y: auto;
    }

    #painel-info h2 { color: #7ee898; font-family: 'Courier New', monospace; text-transform: uppercase; font-size: 1.1rem; margin-bottom: 2px; border-bottom: 1px dashed rgba(126,232,152,0.3); padding-bottom: 8px; }
    #painel-info .cientifico { font-style: italic; color: #a8d8b8; font-size: 0.85rem; margin-bottom: 10px; }

    .btn-hotspot {
      display: flex; align-items: center; gap: 10px;
      background: rgba(126, 232, 152, 0.1);
      border: 1px solid rgba(126, 232, 152, 0.4);
      color: #d5ffdd;
      padding: 12px 15px;
      border-radius: 10px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.9rem; font-weight: 600;
      cursor: pointer; text-align: left;
      transition: all 0.2s;
    }
    .btn-hotspot:active { background: rgba(126, 232, 152, 0.3); border-color: #7ee898; transform: scale(0.98); }
    .btn-hotspot .icone { font-size: 1.1rem; }

    .btn-fechar {
      background: linear-gradient(135deg, #dc0a2d, #a3081f);
      color: white; border: none; padding: 14px; border-radius: 10px;
      font-weight: bold; font-size: 0.95rem; cursor: pointer; margin-top: 10px;
      text-transform: uppercase; letter-spacing: 1px;
      box-shadow: 0 4px 12px rgba(220,10,45,0.4);
    }

    /* Instrução inicial */
    .hint { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #ffcb05; padding: 10px 20px; border-radius: 20px; font-weight: bold; z-index: 999; border: 2px solid #ffcb05; text-align: center; width: 90%; max-width: 400px; font-family: 'Courier New', monospace; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="hint" id="hint">📷 Aponte para o QR Code do animal</div>

  <!-- Painel de Informações -->
  <div id="painel-info">
    <h2 id="info-nome">Carregando...</h2>
    <div class="cientifico" id="info-cientifico"></div>
    
    <button class="btn-hotspot" id="btn-oque">
      <span class="icone">❓</span> O que é?
    </button>
    <button class="btn-hotspot" id="btn-alimentacao">
      <span class="icone">🥩</span> Alimentação
    </button>
    <button class="btn-hotspot" id="btn-habitat">
      <span class="icone">🌿</span> Habitat
    </button>
    <button class="btn-hotspot" id="btn-ameacas">
      <span class="icone">⚠️</span> Ameaças
    </button>
    
    <button class="btn-fechar" id="btn-fechar">Fechar e escanear novamente</button>
  </div>

  <div id="scene-container"></div>

  <script>
    // Pega o ID do animal pela URL (ex: visualizar3d_fauna.html?id=pe-1)
    const params = new URLSearchParams(window.location.search);
    const animalId = params.get('id') || 'pe-1'; 

    // ==========================================
    // 1. SISTEMA DE VOZ (Text-to-Speech)
    // ==========================================
    const synth = window.speechSynthesis;
    function falar(texto) {
      synth.cancel(); // Para áudio anterior
      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = 'pt-BR';
      utterance.rate = 1.0; 
      const vozes = synth.getVoices();
      const vozPt = vozes.find(v => v.lang.includes('pt-BR'));
      if (vozPt) utterance.voice = vozPt;
      synth.speak(utterance);
    }

    // ==========================================
    // 2. DADOS DO ANIMAL (Rápido e Offline)
    // ==========================================
    // Aqui você pode adicionar os outros animais depois. 
    // Usei o Peixe-boi como exemplo padrão.
    const dadosAnimais = {
      'pe-1': { 
        nome: 'Peixe-boi-marinho', 
        cientifico: 'Trichechus manatus', 
        modelo: 'assets/modelo/peixeboi_med.glb', // Lembre-se de ter o modelo _med
        oque: 'Um mamífero aquático dócil que pode pesar 1 tonelada e medir até 4 metros.', 
        alimentacao: 'Herbívoro, alimenta-se de capim-marinho e algas.', 
        habitat: 'Águas calmas de estuários, baías e manguezais.', 
        ameacas: 'Colisões com barcos, redes de pesca e destruição do habitat.' 
      },
      'pe-2': { 
        nome: 'Tamanduá-bandeira', 
        cientifico: 'Myrmecophaga tridactyla', 
        modelo: 'assets/modelo/tamandua_med.glb', 
        oque: 'Um mamífero com uma língua pegajosa de 60cm.', 
        alimentacao: 'Especialista em comer formigas e cupins.', 
        habitat: 'Cerrado, campos e áreas abertas.', 
        ameacas: 'Atropelamentos, queimadas e perda de habitat.' 
      }
    };

    const dados = dadosAnimais[animalId] || dadosAnimais['pe-1'];
    
    // Atualiza o HTML com os dados
    document.getElementById('info-nome').textContent = dados.nome;
    document.getElementById('info-cientifico').textContent = dados.cientifico;
    
    document.getElementById('btn-oque').onclick = () => falar("O que é: " + dados.oque);
    document.getElementById('btn-alimentacao').onclick = () => falar("Alimentação: " + dados.alimentacao);
    document.getElementById('btn-habitat').onclick = () => falar("Habitat: " + dados.habitat);
    document.getElementById('btn-ameacas').onclick = () => falar("Ameaças: " + dados.ameacas);

    // ==========================================
    // 3. CRIAÇÃO DA CENA AR
    // ==========================================
    const container = document.getElementById('scene-container');
    
    container.innerHTML = `
      <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;" renderer="alpha: true; antialias: true;" vr-mode-ui="enabled: false" loading-screen="enabled: false">
        
        <a-assets>
          <!-- Carrega o modelo usando o caminho definido no JSON -->
          <a-asset-item id="modelo-animal" src="${dados.modelo}"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- O Marcador 5 (Onde o bicho vai aparecer) -->
        <a-marker type="barcode" value="5" id="marcador" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="3">
          
          <a-entity id="modelo-wrapper" visible="false">
            <a-gltf-model id="animal-3d" src="#modelo-animal" rotation="0 0 0" scale="1 1 1"></a-gltf-model>
          </a-entity>

          <!-- Luzes para o modelo não ficar escuro -->
          <a-entity light="type: ambient; color: #ffffff; intensity: 1.2"></a-entity>
          <a-entity position="0 2 1" light="type: directional; color: #ffffff; intensity: 1.0"></a-entity>
        </a-marker>
      </a-scene>
    `;

    const cena = container.querySelector('a-scene');
    const marcador = cena.querySelector('#marcador');
    const modeloWrapper = cena.querySelector('#modelo-wrapper');
    const painel = document.getElementById('painel-info');
    const hint = document.getElementById('hint');

    // Quando o QR Code é reconhecido
    marcador.addEventListener('markerFound', () => {
      hint.style.display = 'none';
      ajustarModelo();

      setTimeout(() => {
        modeloWrapper.setAttribute('visible', 'true');
        painel.style.display = 'flex';
      }, 800); // Pequeno delay de 0.8s pro celular processar
    });

    // Quando perde o QR Code de vista
    marcador.addEventListener('markerLost', () => {
      // Deixa o painel visível para a pessoa ler, mas o modelo some se perder o QR
      // modeloWrapper.setAttribute('visible', 'false'); 
    });

    // Função para deixar o modelo no tamanho certo (1.5 metros)
    function ajustarModelo() {
      const modelo = document.getElementById('animal-3d');
      let tentativas = 0;
      
      const ajustar = () => {
        const mesh = modelo.getObject3D('mesh');
        if (!mesh) {
          if (tentativas++ < 50) setTimeout(ajustar, 100);
          return;
        }
        
        mesh.position.set(0, 0, 0);
        mesh.rotation.set(0, 0, 0);
        mesh.scale.set(1, 1, 1);
        mesh.updateMatrixWorld(true);
        
        const box = new THREE.Box3().setFromObject(mesh);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        
        const ALVO = 1.5; 
        const escala = ALVO / maxDim;
        
        mesh.scale.set(escala, escala, escala);
        mesh.position.set(-center.x * escala, -center.y * escala + (size.y * escala / 2), -center.z * escala);
        mesh.updateMatrixWorld(true);
      };
      ajustar();
    }

    // Botão de Fechar
    document.getElementById('btn-fechar').addEventListener('click', () => {
      synth.cancel();
      modeloWrapper.setAttribute('visible', 'false');
      painel.style.display = 'none';
      hint.style.display = 'block';
      hint.textContent = "📷 Aponte para o QR Code novamente";
    });
  </script>
</body>
</html>
