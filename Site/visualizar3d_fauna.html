<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Realidade Aumentada — Projeto Mew</title>
  
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100dvh; overflow: hidden; background: transparent !important; touch-action: none; font-family: 'Segoe UI', sans-serif; }
    
    #scene-container { position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 0; }

    /* BOTÃO FLUTUANTE DE INFORMAÇÕES (BOLINHA) */
    #btn-info-fab {
      position: fixed; bottom: 20px; right: 20px;
      width: 50px; height: 50px; border-radius: 50%;
      background: #7ee898; color: #051020; font-size: 1.5rem;
      border: 2px solid #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000; cursor: pointer; transition: transform 0.2s;
    }
    #btn-info-fab:active { transform: scale(0.9); }

    /* POPUP DE INFORMAÇÕES (OCULTO POR PADRÃO) */
    #painel-info {
      position: fixed;
      bottom: 80px; right: 20px;
      width: 280px;
      background: rgba(5, 30, 15, 0.95);
      border: 2px solid #7ee898;
      border-radius: 12px;
      padding: 12px 15px;
      z-index: 1001;
      display: none; /* Escondido */
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      max-height: 60vh; overflow-y: auto;
    }

    #painel-info h2 { color: #7ee898; font-family: 'Courier New', monospace; text-transform: uppercase; font-size: 0.9rem; margin-bottom: 2px; border-bottom: 1px dashed rgba(126,232,152,0.3); padding-bottom: 6px; }
    #painel-info .cientifico { font-style: italic; color: #a8d8b8; font-size: 0.7rem; margin-bottom: 5px; }

    .btn-hotspot {
      display: flex; align-items: center; gap: 8px;
      background: rgba(126, 232, 152, 0.1); border: 1px solid rgba(126, 232, 152, 0.4);
      color: #d5ffdd; padding: 8px 10px; border-radius: 8px;
      font-size: 0.75rem; font-weight: 600; cursor: pointer; text-align: left;
    }
    .btn-hotspot:active { background: rgba(126, 232, 152, 0.3); }

    .btn-fechar {
      background: linear-gradient(135deg, #dc0a2d, #a3081f); color: white;
      border: none; padding: 8px; border-radius: 8px; font-weight: bold;
      font-size: 0.8rem; cursor: pointer; margin-top: 5px; text-transform: uppercase;
    }

    /* HINT (AVISO INICIAL) */
    .hint { 
      position: fixed; top: 15px; left: 50%; transform: translateX(-50%); 
      background: rgba(0,0,0,0.8); color: #ffcb05; padding: 8px 15px; border-radius: 15px; 
      font-weight: bold; z-index: 999; border: 2px solid #ffcb05; text-align: center; 
      width: 90%; max-width: 350px; font-family: 'Courier New', monospace; font-size: 0.75rem; 
    }

    /* MENU DE SELEÇÃO */
    #menu-animais {
      display: none; position: fixed; inset: 0;
      background: rgba(5, 15, 10, 0.98); z-index: 10000;
      flex-direction: column; padding: 20px; backdrop-filter: blur(10px);
    }
    .menu-header { text-align: center; margin-bottom: 15px; }
    .menu-header h2 { color: #7ee898; font-family: 'Courier New', monospace; font-size: 1.2rem; }
    .menu-header p { color: #a8d8b8; font-size: 0.8rem; margin-top: 5px; }
    
    .menu-grid { flex: 1; overflow-y: auto; display: grid; gap: 10px; }
    .menu-item {
      background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(126, 232, 152, 0.3);
      border-radius: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center;
    }
    .menu-nome { color: #e0f4ff; font-weight: bold; font-size: 0.9rem; }
    .menu-acoes { display: flex; gap: 8px; }
    .btn-acao { border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; font-size: 0.75rem; cursor: pointer; }
    .btn-3d { background: #7ee898; color: #051020; }
    .btn-info { background: #00e0ff; color: #051020; }

    #btn-voltar-ar { margin-top: 10px; background: #ffcb05; color: #000; font-size: 0.9rem; padding: 12px; border: none; border-radius: 8px; font-weight: bold; }

    /* OVERLAY DE IMAGEM DOS HOTSPOTS */
    #ar-image-overlay {
      display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 9999; width: 80vw; max-width: 350px;
      border-radius: 12px; overflow: hidden; border: 3px solid #7ee898;
      pointer-events: none; animation: popIn 0.3s;
    }
    #ar-image-overlay img { width: 100%; display: block; }
    @keyframes popIn { from{ opacity: 0; transform: translate(-50%, -40%) scale(0.9); } to{ opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  </style>
</head>
<body>
  <div class="hint" id="hint">
    <span id="hint-texto">📷 Aponte para o QR Code...</span>
  </div>

  <!-- IMAGEM DO HOTSPOT -->
  <div id="ar-image-overlay">
    <img id="ar-image-content" src="" alt="Hotspot">
  </div>

  <!-- BOTÃO FLUTUANTE -->
  <div id="btn-info-fab">ℹ️</div>

  <!-- POPUP DE INFO DO ANIMAL -->
  <div id="painel-info">
    <h2 id="info-nome">Carregando...</h2>
    <div class="cientifico" id="info-cientifico"></div>
    
    <button class="btn-hotspot" id="btn-oque"><span class="icone">❓</span> O que é?</button>
    <button class="btn-hotspot" id="btn-alimentacao"><span class="icone">🥩</span> Alimentação</button>
    <button class="btn-hotspot" id="btn-habitat"><span class="icone">🌿</span> Habitat</button>
    <button class="btn-hotspot" id="btn-ameacas"><span class="icone">⚠️</span> Ameaças</button>
    
    <button class="btn-fechar" id="btn-abrir-menu">Trocar de Animal</button>
  </div>

  <!-- MENU DE SELEÇÃO -->
  <div id="menu-animais">
    <div class="menu-header">
      <h2>Escolha um Animal</h2>
      <p>O animal será fixado no QR Code</p>
    </div>
    <div class="menu-grid" id="menu-grid"></div>
    <button id="btn-voltar-ar">Voltar para o AR</button>
  </div>

  <div id="scene-container"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    let animalId = params.get('id') || 'pe-1'; 

    const synth = window.speechSynthesis;
    function falar(texto) {
      synth.cancel(); 
      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = 'pt-BR';
      utterance.rate = 1.0; 
      const vozes = synth.getVoices();
      const vozPt = vozes.find(v => v.lang.includes('pt-BR'));
      if (vozPt) utterance.voice = vozPt;
      synth.speak(utterance);
    }

    const modelosMap = {
      'pe-1': 'assets/modelo/peixe_boi_med.glb',
      'pe-2': 'assets/modelo/tamandua_bandeira_med.glb',
      'pe-3': 'assets/modelo/tatu_bola_do_nordeste_med.glb',
      'pe-4': 'assets/modelo/saira_pintor_med.glb',
      'pe-5': 'assets/modelo/limpa_folha_do_nordeste_med.glb',
      'pe-6': 'assets/modelo/gato_maracaja_med.glb',
      'pe-7': 'assets/modelo/jaguatirica_med.glb',
      'pe-8': 'assets/modelo/tartaruga_de_pente_med.glb',
      'pe-9': 'assets/modelo/tartaruga_de_couro_med.glb',
      'pe-10': 'assets/modelo/galo_de_campina_novo.glb'
    };

    const imagensMap = {
      'pe-1': { oque: 'assets/hotspots/costeiro_peixeboi_animal.jpg', alimentacao: 'assets/hotspots/costeiro_peixeboi_capim.jpg', habitat: 'assets/hotspots/costeiro_peixeboi_estuario.jpg', ameacas: 'assets/hotspots/costeiro_peixeboi_boia.jpg' },
      'pe-2': { oque: 'assets/hotspots/cerrado_tamandua_animal.jpg', alimentacao: 'assets/hotspots/cerrado_tamandua_cupinzeiro.jpg', habitat: 'assets/hotspots/cerrado_tamandua_bioma.jpg', ameacas: 'assets/hotspots/cerrado_tamandua_ameacas.jpg' }
    };

    const listaAnimais = [
      { id: 'pe-1', nome: 'Peixe-boi-marinho' }, { id: 'pe-2', nome: 'Tamanduá-bandeira' },
      { id: 'pe-3', nome: 'Tatu-bola-do-nordeste' }, { id: 'pe-4', nome: 'Saíra-pintor' },
      { id: 'pe-5', nome: 'Limpa-folha-do-nordeste' }, { id: 'pe-6', nome: 'Gato-maracajá' },
      { id: 'pe-7', nome: 'Jaguatirica' }, { id: 'pe-8', nome: 'Tartaruga-de-pente' },
      { id: 'pe-9', nome: 'Tartaruga-de-couro' }, { id: 'pe-10', nome: 'Galo-de-Campina' }
    ];

    // CONTROLE DE UI
    const painel = document.getElementById('painel-info');
    const menu = document.getElementById('menu-animais');

    document.getElementById('btn-info-fab').addEventListener('click', () => {
      painel.style.display = painel.style.display === 'flex' ? 'none' : 'flex';
    });

    document.getElementById('btn-abrir-menu').addEventListener('click', () => {
      painel.style.display = 'none';
      menu.style.display = 'flex';
    });

    document.getElementById('btn-voltar-ar').addEventListener('click', () => {
      menu.style.display = 'none';
    });

    document.getElementById('menu-grid').innerHTML = listaAnimais.map(a => `
      <div class="menu-item">
        <span class="menu-nome">${a.nome}</span>
        <div class="menu-acoes">
          <button class="btn-acao btn-3d" onclick="mudarAnimal('${a.id}')">🔮 Carregar</button>
          <button class="btn-acao btn-info" onclick="window.location.href='detalhes.html?id=${a.id}'">📖 Info</button>
        </div>
      </div>
    `).join('');

    // TROCA O MODELO SEM RECARREGAR A PÁGINA
    window.mudarAnimal = (novoId) => {
      animalId = novoId;
      menu.style.display = 'none';
      painel.style.display = 'flex'; 
      
      const animal = window.dadosFauna.especies_ameacadas.find(a => a.id === animalId);
      document.getElementById('info-nome').textContent = animal.nome_popular;
      document.getElementById('info-cientifico').textContent = animal.nome_cientifico;
      
      const modeloPath = modelosMap[animalId];
      document.getElementById('modelo-animal').setAttribute('src', modeloPath);
      document.getElementById('animal-ar').setAttribute('src', '#modelo-animal'); 
      
      atualizarBotoesAudio(animal);
    };

    function atualizarBotoesAudio(animal) {
      const textoOque = `${animal.classe}. ${animal.caracteristicas.comportamento}.`;
      const textoAlimentacao = `Alimenta-se de ${animal.alimentacao.join(', ')}.`;
      const textoHabitat = `Encontrado em ${animal.habitat.join(', ')}.`;
      const textoAmeacas = `As principais ameaças são: ${animal.principais_ameacas.join(', ')}.`;

      document.getElementById('btn-oque').onclick = () => falarEMostrar(textoOque, imagensMap[animalId]?.oque);
      document.getElementById('btn-alimentacao').onclick = () => falarEMostrar(textoAlimentacao, imagensMap[animalId]?.alimentacao);
      document.getElementById('btn-habitat').onclick = () => falarEMostrar(textoHabitat, imagensMap[animalId]?.habitat);
      document.getElementById('btn-ameacas').onclick = () => falarEMostrar(textoAmeacas, imagensMap[animalId]?.ameacas);
    }

    let timeoutImagem;
    function falarEMostrar(texto, imagemSrc) {
      falar(texto);
      if (imagemSrc) {
        const overlay = document.getElementById('ar-image-overlay');
        const img = document.getElementById('ar-image-content');
        img.src = imagemSrc;
        overlay.style.display = 'block';
        clearTimeout(timeoutImagem);
        timeoutImagem = setTimeout(() => { overlay.style.display = 'none'; }, 15000);
      }
    }

    async function iniciarAR() {
      try {
        const res = await fetch('fauna_pe.json');
        window.dadosFauna = await res.json();
        const animal = window.dadosFauna.especies_ameacadas.find(a => a.id === animalId);

        document.getElementById('info-nome').textContent = animal.nome_popular;
        document.getElementById('info-cientifico').textContent = animal.nome_cientifico;
        atualizarBotoesAudio(animal);

        const modeloPath = modelosMap[animalId];
        const container = document.getElementById('scene-container');
        
        container.innerHTML = `
          <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;" renderer="alpha: true; antialias: true;" vr-mode-ui="enabled: false" loading-screen="enabled: false">
            <a-assets>
              <a-asset-item id="modelo-animal" src="${modeloPath}"></a-asset-item>
            </a-assets>

            <a-entity light="type: ambient; color: #ffffff; intensity: 1.2"></a-entity>
            <a-entity position="0 5 2" light="type: directional; color: #ffffff; intensity: 1.5"></a-entity>

            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <a-marker type="barcode" value="7" id="marcador" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
              <a-entity id="modelo-wrapper" visible="false" drag-rotate>
                <a-gltf-model id="animal-ar" src="#modelo-animal"></a-gltf-model>
              </a-entity>
            </a-marker>
          </a-scene>
        `;

        const marcador = container.querySelector('#marcador');
        const modeloWrapper = container.querySelector('#modelo-wrapper');
        const hint = document.getElementById('hint');
        const animal3D = container.querySelector('#animal-ar');

        animal3D.addEventListener('model-loaded', () => {
          document.getElementById('hint-texto').textContent = "✅ Modelo Carregado!";
          const mesh = animal3D.getObject3D('mesh');
          if (!mesh) return;
          const box = new THREE.Box3().setFromObject(mesh);
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z);
          
          const escala = 1.0 / maxDim;
          mesh.scale.set(escala, escala, escala);
          mesh.position.set(0, (size.y * escala) / 2, 0);
        });

        marcador.addEventListener('markerFound', () => {
          modeloWrapper.setAttribute('visible', 'true');
          hint.style.display = 'none';
        });

        marcador.addEventListener('markerLost', () => {
          modeloWrapper.setAttribute('visible', 'false');
        });

      } catch (erro) {
        console.error(erro);
        document.getElementById('hint-texto').textContent = "❌ Erro no JSON.";
      }
    }

    AFRAME.registerComponent('drag-rotate', {
      init: function () {
        this.isDragging = false;
        this.previousMousePosition = { x: 0, y: 0 };
        this.el.sceneEl.canvas.addEventListener('touchstart', (e) => {
          if(e.touches.length === 1) { this.isDragging = true; this.previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }
        }, { passive: true });
        this.el.sceneEl.canvas.addEventListener('touchmove', (e) => {
          if (!this.isDragging || e.touches.length !== 1) return;
          const deltaX = e.touches[0].clientX - this.previousMousePosition.x;
          const deltaY = e.touches[0].clientY - this.previousMousePosition.y;
          this.el.object3D.rotation.y += deltaX * 0.01;
          this.el.object3D.rotation.x += deltaY * 0.01;
          this.previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
          if(e.cancelable) e.preventDefault();
        }, { passive: false });
        this.el.sceneEl.canvas.addEventListener('touchend', () => { this.isDragging = false; });
      }
    });

    window.addEventListener('DOMContentLoaded', iniciarAR);
  </script>
</body>
</html>
