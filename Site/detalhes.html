<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Detalhes do Pokémon</title>
  <link rel="stylesheet" href="style.css">
  <!-- A-Frame: usado tanto pelo viewer de fauna quanto por visualizar3d -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="pokedex-frame">
    <div class="pokedex-top">
      <div class="light-big"></div>
      <div class="lights-small">
        <span class="light-small red"></span>
        <span class="light-small yellow"></span>
        <span class="light-small green"></span>Git Status
      </div>
      <a href="index.html" class="voltar">← Voltar</a>
    </div>

    <h1 class="pokedex-title">Pokédex</h1>

    <div class="pokedex-main">
      <div id="detalhes-container">
        <div id="loading-detalhes" class="loading">Carregando detalhes...</div>
      </div>
    </div>

    <div class="rodape">
      Dados fornecidos pela <a href="https://pokeapi.co/" target="_blank">PokeAPI</a>
    </div>
  </div>

  <div id="modal-container"></div>

  <!-- Módulo de biomas da fauna (precisa vir ANTES do detalhes.js) -->
  <script src="api.js"></script>
  <script src="biomas_fauna.js"></script>
  <script src="bioma_componentes.js"></script>
  <script src="bioma_costeiro.js"></script>
  <script src="bioma_mataatlantica.js"></script>
  <script src="bioma_caatinga_galo.js"></script>
  <script src="bioma_caatinga_tatu.js"></script>
  <script src="bioma_cerrado_tamandua.js"></script>
  <script src="bioma_mata_limpafolha.js"></script>
  <script src="bioma_mata_maracaja.js"></script>            <!-- NOVO -->
  <script src="bioma_transicao_jaguatirica.js"></script>     <!-- NOVO -->
  <script src="bioma_recife_tartaruga_pente.js"></script>    <!-- NOVO -->
  <script src="bioma_oceano_tartaruga_couro.js"></script>    <!-- NOVO -->
  <script src="detalhes.js"></script>
</body>
</html>
