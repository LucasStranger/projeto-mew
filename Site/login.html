<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Projeto MEW</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="autenticacao.css">
  <script src="api.js" defer></script>
  <script src="autenticacao.js" defer></script>
</head>
<body class="auth-page">
  <main class="pokedex-frame auth-frame">
    <div class="pokedex-top" aria-hidden="true">
      <div class="light-big"></div>
      <div class="lights-small"><span class="light-small red"></span><span class="light-small yellow"></span><span class="light-small green"></span></div>
    </div>
    <p class="pokedex-title">Projeto MEW</p>
    <div class="pokedex-main">
      <nav class="abas" aria-label="Acesso à conta">
        <a class="aba ativa" href="login.html" data-auth-link aria-current="page">Entrar</a>
        <a class="aba" href="cadastro.html" data-auth-link>Criar conta</a>
      </nav>
      <section class="screen auth-screen" aria-labelledby="auth-title">
        <p class="auth-eyebrow">▸ Sua missão continua</p>
        <h1 id="auth-title">Bem-vindo de volta!</h1>
        <p class="auth-description">Entre para continuar os desafios e acompanhar sua pontuação na Mewdex.</p>
        <p id="conta-atual" class="auth-current" hidden></p>
        <form id="auth-form" data-mode="login" action="login.html" method="post">
          <div class="filtro-grupo">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="username" maxlength="100" placeholder="seuemail@exemplo.com" required>
          </div>
          <div class="filtro-grupo">
            <label for="senha">Senha</label>
            <div class="auth-password">
              <input id="senha" name="senha" type="password" autocomplete="current-password" maxlength="128" required>
              <button type="button" class="auth-toggle" aria-controls="senha" aria-pressed="false">Mostrar</button>
            </div>
          </div>
          <p id="auth-error" class="auth-error" role="alert" tabindex="-1" hidden></p>
          <button class="auth-submit" type="submit">Entrar na conta</button>
          <p id="auth-status" class="auth-status" role="status"></p>
        </form>
        <p class="auth-switch">Primeira visita? <a href="cadastro.html" data-auth-link>Crie sua conta</a></p>
      </section>
    </div>
    <div class="rodape"><a href="index.html">← Voltar à Pokédex</a></div>
    <noscript><p class="auth-error">Ative o JavaScript para entrar na sua conta.</p></noscript>
  </main>
</body>
</html>
